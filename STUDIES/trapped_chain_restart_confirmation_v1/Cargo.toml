[package]
name = "trapped-chain-restart-confirmation-v1"
version = "0.1.0"
edition = "2024"
publish = false
description = "WP69: confirmation of the WP67 trapped-chain restart (research-only opt-in)"

[dependencies]
# `research`: the observe-only comparison observer (lotka telemetry) and the
# research-only WarmupConfig::with_trapped_chain_restart; it changes no default.
owalnuts = { path = "../..", features = ["research"] }
owalnuts-bridgestan = { path = "../../integrations/bridgestan" }
serde_json = "1"

[[bin]]
name = "trap-cell"
path = "src/bin/trap_cell.rs"

[[bin]]
name = "pdb-cell"
path = "src/bin/pdb_cell.rs"

[[bin]]
name = "two-mode"
path = "src/bin/two_mode.rs"

[[bin]]
name = "sync-cost"
path = "src/bin/sync_cost.rs"

[profile.release]
debug = false

[workspace]
