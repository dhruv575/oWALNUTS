[package]
name = "warmup-spend-v1"
version = "0.1.0"
edition = "2024"
publish = false
description = "WP73: where oWALNUTS spends its warmup gradients against CmdStan and nutpie, and three research warmup schedules"

[lib]
name = "warmup_spend_v1"
path = "src/lib.rs"

[dependencies]
owalnuts = { path = "../.." }
owalnuts-bridgestan = { path = "../../integrations/bridgestan" }
serde_json = "1"

# A copy of the WP70 harness (itself the WP65 / v7 harness) with the WP73 arms and warmup-spend records.
[[bin]]
name = "harness"
path = "src/main.rs"

# A copy of WP66's funnel binary with the WP73 arms (rule clause R3).
[[bin]]
name = "funnel"
path = "src/bin/funnel.rs"

[workspace]
