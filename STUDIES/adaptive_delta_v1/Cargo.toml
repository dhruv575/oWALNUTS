[package]
name = "adaptive-delta-v1"
version = "0.1.0"
edition = "2024"
publish = false
description = "oWALNUTS arms of the preregistered adaptive-delta study (WP49): delta adapted from the observed level-0 leaf-error distribution; posteriordb v5 protocol, funnel tail mass and gross safety, Eight Schools strict track"

[dependencies]
owalnuts = { path = "../.." }
owalnuts-bridgestan = { path = "../../integrations/bridgestan" }
serde_json = "1"
sha2 = "0.10"
rand = { version = "0.9", features = ["small_rng"] }
rand_distr = "0.5"

[[bin]]
name = "posteriordb-cell"
path = "src/main.rs"

[[bin]]
name = "funnel"
path = "src/bin/funnel.rs"

[[bin]]
name = "eight-schools"
path = "src/bin/eight_schools.rs"

[[bin]]
name = "calibrate"
path = "src/bin/calibrate.rs"

[workspace]
