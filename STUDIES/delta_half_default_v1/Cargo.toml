[package]
name = "delta-half-default-v1"
version = "0.1.0"
edition = "2024"
publish = false
description = "WP42: delta 1 vs 0.75 vs 0.5 at eight refinement levels on the 17-model posteriordb screen, Neal's funnel and the Eight Schools strict track"

[dependencies]
owalnuts = { path = "../.." }
owalnuts-bridgestan = { path = "../../integrations/bridgestan" }
serde_json = "1"
sha2 = "0.10"
rand = { version = "0.9", features = ["small_rng"] }
rand_distr = "0.5"

[[bin]]
name = "posteriordb-cell"
path = "src/main.rs"

[[bin]]
name = "funnel"
path = "src/bin/funnel.rs"

[[bin]]
name = "eight-schools"
path = "src/bin/eight_schools.rs"

[workspace]
