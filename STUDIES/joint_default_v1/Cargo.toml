[package]
name = "joint-default-v1"
version = "0.1.0"
edition = "2024"
publish = false
description = "oWALNUTS arms of the preregistered joint default study: UTurnRule::MomentumSum + DiagonalMetricRegularization::Stan (posteriordb v3 harness, funnel tail mass, Eight Schools strict track)"

[dependencies]
owalnuts = { path = "../.." }
owalnuts-bridgestan = { path = "../../integrations/bridgestan" }
