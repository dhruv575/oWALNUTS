[package]
name = "python-callpath-linux-v1"
version = "0.1.0"
edition = "2024"
publish = false
description = "WP78: pure-Rust reference arm (native WP47/WP58 densities, sampler defaults)"

[dependencies]
owalnuts = { path = "../../.." }
serde_json = "1"

[[bin]]
name = "wp78-rust"
path = "src/main.rs"

# The Python extension's release profile (integrations/python/Cargo.toml), so
# the kernel is compiled the same way in the Rust arm and in the wheel.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[workspace]
