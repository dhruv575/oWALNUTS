[package]
name = "online-sv-quote-v2"
version = "0.1.0"
edition = "2024"
publish = false
description = "WP88: oWALNUTS arms (gated reference, refit, library warm continuation) for the online SV quote stream"

[dependencies]
owalnuts = { path = "../../.." }
serde_json = { version = "1", features = ["float_roundtrip"] }

[[bin]]
name = "wp88"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[workspace]
