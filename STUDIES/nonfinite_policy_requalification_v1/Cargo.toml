[package]
name = "nonfinite-policy-requalification-v1"
version = "0.1.0"
edition = "2024"
publish = false
description = "WP54: NonfinitePositionPolicy Abort versus RejectLeaf default-flip confirmation on the 17-model posteriordb screen, a stress set and the funnel"

[dependencies]
# `research` is needed only to select NonfinitePositionPolicy::RejectLeaf; it changes no default.
owalnuts = { path = "../..", features = ["research"] }
owalnuts-bridgestan = { path = "../../integrations/bridgestan" }
serde_json = "1"

[[bin]]
name = "policy-cell"
path = "src/main.rs"

[[bin]]
name = "funnel"
path = "src/bin/funnel.rs"

[profile.release]
debug = false

[workspace]
