[package]
name = "dense-metric-posteriordb-v1"
version = "0.1.0"
edition = "2024"
publish = false
description = "WP48: adapted dense metric versus the default diagonal metric on the 17-model posteriordb screen"

[dependencies]
owalnuts = { path = "../.." }
owalnuts-bridgestan = { path = "../../integrations/bridgestan" }
serde_json = "1"

[[bin]]
name = "dense-cell"
path = "src/main.rs"

[[bin]]
name = "funnel"
path = "src/bin/funnel.rs"

[[bin]]
name = "overhead"
path = "src/bin/overhead.rs"

[profile.release]
debug = false

[workspace]
