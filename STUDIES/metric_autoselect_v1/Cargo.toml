[package]
name = "metric-autoselect-v1"
version = "0.1.0"
edition = "2024"
publish = false
description = "WP75: can the sampler choose dense vs diagonal per run from a warmup-window statistic (research flag), keeping the dense wins without losing diagonal gates?"

[dependencies]
# One build for every arm: the candidate arms need the research-only
# `WarmupConfig::with_dense_auto_select`.
owalnuts = { path = "../..", features = ["research"] }
owalnuts-bridgestan = { path = "../../integrations/bridgestan" }
serde_json = "1"

[[bin]]
name = "funnel"
path = "src/bin/funnel.rs"

[[bin]]
name = "pdb"
path = "src/bin/pdb.rs"

[workspace]
