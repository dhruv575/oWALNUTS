[package]
name = "metric-autoselect-confirmation-v1"
version = "0.1.0"
edition = "2024"
publish = false
description = "WP79: per-run dense / diagonal auto-selection, v2: the diagonal branch is the diagonal driver itself, and a Hessian-fit statistic with a linearity guard (research flag)"

[dependencies]
# One build for every arm: the candidate arms need the research-only
# `WarmupConfig::with_dense_auto_select` (`DenseAutoSelectConfig::hessian_fit`).
owalnuts = { path = "../..", features = ["research"] }
owalnuts-bridgestan = { path = "../../integrations/bridgestan" }
serde_json = "1"

[[bin]]
name = "funnel"
path = "src/bin/funnel.rs"

[[bin]]
name = "pdb"
path = "src/bin/pdb.rs"

[workspace]
