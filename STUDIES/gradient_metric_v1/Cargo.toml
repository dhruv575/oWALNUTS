[package]
name = "gradient-metric-v1"
version = "0.1.0"
edition = "2024"
publish = false
description = "WP71: does a gradient-informed diagonal metric estimator (research flag) raise ESS per gradient on the house posteriordb models without losing gates?"

[dependencies]
# One build for every arm: the candidate arms need the research-only
# `WarmupConfig::with_diagonal_metric_estimator`.
owalnuts = { path = "../..", features = ["research"] }
owalnuts-bridgestan = { path = "../../integrations/bridgestan" }
serde_json = "1"

[[bin]]
name = "funnel"
path = "src/bin/funnel.rs"

[[bin]]
name = "pdb"
path = "src/bin/pdb.rs"

[workspace]
