[package]
name = "owalnuts-autodiff"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Write a log density once, generically; get an oWALNUTS Target with a fused-primitive reverse-mode gradient"
license = "MIT"

[dependencies]
owalnuts = { path = "../.." }
libm = "0.2"

[dev-dependencies]
rand = { version = "0.9", features = ["small_rng"] }
serde_json = "1"

[[example]]
name = "bench"
path = "examples/bench.rs"

[profile.release]
debug = false

[workspace]
