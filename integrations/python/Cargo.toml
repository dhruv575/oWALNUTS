[package]
name = "owalnuts-python"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Python bindings for the oWALNUTS walnutpie facade (callable, JAX, PyTorch, PyMC, Stan targets)"
license = "MIT"
repository = "https://github.com/dhruv575/oWALNUTS"

[lib]
name = "_owalnuts"
crate-type = ["cdylib"]
path = "src/lib.rs"

[features]
default = ["stan"]
# BridgeStan-compiled Stan models through `owalnuts-bridgestan`
# (`ReplicatedStanTarget`; Windows uses one owned worker).
stan = ["dep:owalnuts-bridgestan"]

[dependencies]
owalnuts = { path = "../..", features = ["research"] }
owalnuts-bridgestan = { path = "../bridgestan", optional = true }
# `abi3-py310`: one wheel per platform covers CPython 3.10+ (stable ABI).
pyo3 = { version = "0.28", features = ["extension-module", "generate-import-lib", "abi3-py310"] }
numpy = "0.28"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
