[package]
name = "owalnuts-bridgestan"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "oWALNUTS Target over a BridgeStan-compiled Stan model (hand-written libloading FFI)"
license = "MIT"

[dependencies]
owalnuts = { path = "../.." }
owalnuts-autodiff-tape = { path = "../enzyme" }
libloading = "0.8"
serde_json = "1"
rand = { version = "0.9", features = ["small_rng"] }
rand_distr = "0.5"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[workspace]
