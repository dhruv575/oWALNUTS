[package]
name = "owalnuts-autodiff-tape"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Pure-Rust reverse-mode (tape) stand-in for Enzyme: local-level log density as an oWALNUTS Target"
license = "MIT"

[dependencies]
owalnuts = { path = "../.." }
reverse = "0.2.2"
serde_json = "1"
rand = { version = "0.9", features = ["small_rng"] }
rand_distr = "0.5"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[workspace]
