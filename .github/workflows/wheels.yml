name: Python wheels

# Builds the `owalnuts` Python package (integrations/python) for PyPI:
# abi3 (CPython 3.10+) wheels for Linux x86_64/aarch64 (manylinux), macOS
# x86_64/arm64 and Windows x86_64, plus the sdist; every wheel is installed
# into a fresh interpreter and the pure-numpy tests run against it. The
# optional-backend tests (JAX, PyTorch, PyMC, numba, BridgeStan) run on
# Linux only. Publishing uses PyPI trusted publishing (OIDC, no secrets) and
# only runs for `v*` tags after every build job has passed.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload to PyPI (only honoured on a v* tag)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.88.0
  PACKAGE_DIR: integrations/python

jobs:
  wheels:
    name: wheel ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64
            manylinux: "2014"
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64
            manylinux: "2_28"
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64
          - name: macos-arm64
            os: macos-14
            target: aarch64
          - name: windows-x86_64
            os: windows-latest
            target: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build wheel (abi3, CPython 3.10+)
        uses: PyO3/maturin-action@v1
        with:
          working-directory: ${{ env.PACKAGE_DIR }}
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          rust-toolchain: ${{ env.RUST_TOOLCHAIN }}
          args: --release --locked --out ../../dist
          sccache: "true"
      - name: Test the wheel with the pure-numpy suite
        # Fresh interpreter, no source checkout on sys.path: only what the
        # wheel ships. Backend tests (JAX/torch/PyMC/numba/Stan) skip
        # themselves when the package is missing.
        shell: bash
        run: |
          python -m venv wheel-venv
          if [ -x wheel-venv/bin/python ]; then PY=wheel-venv/bin/python; else PY=wheel-venv/Scripts/python; fi
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install pytest numpy dist/owalnuts-*.whl
          cd "$PACKAGE_DIR/tests"
          "$PY" -c "import owalnuts, sys; print(owalnuts.__file__, owalnuts.ALGORITHM_REVISION, 'stan' if owalnuts.HAS_STAN else 'no-stan', sys.version)"
          "$PY" -m pytest -q -rs test_adapters.py test_stan.py
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Verify the locked Python integration dependency graph
        working-directory: ${{ env.PACKAGE_DIR }}
        run: cargo check --locked --all-features
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: ${{ env.PACKAGE_DIR }}
          command: sdist
          args: --out ../../dist
      - name: List the sdist
        run: tar tzf dist/*.tar.gz
      - name: Build from the sdist in a clean directory and test
        # Proves the sdist is self-contained: the root crate and the
        # bridgestan crate are vendored by maturin (see pyproject.toml).
        run: |
          mkdir -p /tmp/sdist-check && cd /tmp/sdist-check
          python -m venv venv && . venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install pytest numpy
          python -m pip install "$GITHUB_WORKSPACE"/dist/owalnuts-*.tar.gz -v
          cp "$GITHUB_WORKSPACE/$PACKAGE_DIR"/tests/*.py .
          python -m pytest -q -rs test_adapters.py test_stan.py
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  backends:
    name: optional backends (Linux)
    # JAX, PyTorch, PyMC, numba and BridgeStan against the Linux x86_64 wheel.
    needs: wheels
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OWALNUTS_REQUIRE_STAN_TESTS: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          name: wheel-linux-x86_64
          path: dist
      - name: Install the wheel with every optional backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            pytest "arviz>=0.17" "jax>=0.4" "torch>=2.0" "pymc>=5.10" "numba>=0.59" "bridgestan==2.9.0"
          python -m pip install dist/owalnuts-*.whl
      - name: Run the full suite (BridgeStan compiles Eight Schools with the system g++)
        run: |
          cd "$PACKAGE_DIR"
          python -m pytest -q -rs tests

  publish:
    name: publish to PyPI
    # Trusted publishing: configure the `pypi` environment on the repository
    # and register this workflow as a trusted publisher for the `owalnuts`
    # project on pypi.org. No API token lives in the repository.
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true))
    needs: [wheels, sdist, backends]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/owalnuts
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Check the tag matches the package version
        run: |
          ls -l dist
          tag="${GITHUB_REF_NAME#v}"
          for f in dist/owalnuts-*; do
            case "$f" in *"owalnuts-$tag-"*|*"owalnuts-$tag.tar.gz") ;; *) echo "::error::$f does not match tag $tag"; exit 1;; esac
          done
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          print-hash: true
