name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  bounded-checks:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GNU 1.88 (MSRV)
            os: ubuntu-latest
            toolchain: 1.88.0-x86_64-unknown-linux-gnu
          - name: Windows GNU 1.88 (reference toolchain)
            os: windows-latest
            toolchain: 1.88.0-x86_64-pc-windows-gnu
          - name: Linux stable
            os: ubuntu-latest
            toolchain: stable
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (all targets, all features, deny warnings)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Tests (library, oracle parity, public facade, examples)
        run: cargo test --locked --all-targets
      - name: Tests (research feature)
        run: cargo test --locked --all-targets --all-features
      - name: Rustdoc (deny warnings)
        run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Build examples
        run: cargo build --locked --release --examples
      - name: Run bounded examples
        run: |
          cargo run --locked --release --example gaussian
          cargo run --locked --release --example state_space_path_metric
      - name: Package contents
        run: cargo package --locked --no-verify

  integrations:
    name: Integrations (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GNU 1.88
            os: ubuntu-latest
            toolchain: 1.88.0-x86_64-unknown-linux-gnu
          - name: Windows GNU 1.88
            os: windows-latest
            toolchain: 1.88.0-x86_64-pc-windows-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      # owalnuts-autodiff: generic log densities with a fused-primitive tape.
      - name: autodiff — format, clippy
        working-directory: integrations/autodiff
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: autodiff — tests (hand-gradient and finite-difference oracles)
        working-directory: integrations/autodiff
        run: cargo test --locked --release
      # owalnuts-bridgestan: the sampling tests need a BridgeStan-compiled
      # model (`bridgestan/models/*.so`, see its README) and skip themselves
      # when it is absent; CI therefore checks, lints and runs the
      # library-only tests without installing BridgeStan or a Stan toolchain.
      - name: bridgestan — check, clippy
        working-directory: integrations/bridgestan
        run: |
          cargo fmt --all -- --check
          cargo check --locked --all-targets --all-features
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo clippy --locked --all-targets -- -D warnings
      - name: bridgestan — tests (model-dependent tests skip without BridgeStan)
        working-directory: integrations/bridgestan
        run: cargo test --locked --release --all-features
      # owalnuts-python: the PyO3 extension (wheels are built and tested
      # against a fresh interpreter in wheels.yml; this checks the crate).
      - name: python — format, clippy (with and without the `stan` feature)
        working-directory: integrations/python
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo clippy --locked --all-targets --no-default-features -- -D warnings
