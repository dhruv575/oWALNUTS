name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  bounded-checks:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GNU 1.88 (MSRV)
            os: ubuntu-latest
            toolchain: 1.88.0-x86_64-unknown-linux-gnu
          - name: Windows GNU 1.88 (reference toolchain)
            os: windows-latest
            toolchain: 1.88.0-x86_64-pc-windows-gnu
          - name: Windows MSVC 1.88
            os: windows-latest
            toolchain: 1.88.0-x86_64-pc-windows-msvc
          - name: Linux stable
            os: ubuntu-latest
            toolchain: stable
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (all targets, all features, deny warnings)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Tests (library, oracle parity, public facade, examples)
        run: cargo test --locked --all-targets
      - name: Tests (research feature)
        run: cargo test --locked --all-targets --all-features
      - name: Rustdoc (deny warnings)
        run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Build examples
        run: cargo build --locked --release --examples
      - name: Run bounded examples
        run: |
          cargo run --locked --release --example gaussian
          cargo run --locked --release --example state_space_path_metric
      - name: Package contents
        run: cargo package --locked

  integrations:
    name: Integrations (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GNU 1.88
            os: ubuntu-latest
            toolchain: 1.88.0-x86_64-unknown-linux-gnu
          - name: Windows GNU 1.88
            os: windows-latest
            toolchain: 1.88.0-x86_64-pc-windows-gnu
          - name: Windows MSVC 1.88
            os: windows-latest
            toolchain: 1.88.0-x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      # owalnuts-autodiff: generic log densities with a fused-primitive tape.
      - name: autodiff — format, clippy
        working-directory: integrations/autodiff
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: autodiff — tests (hand-gradient and finite-difference oracles)
        working-directory: integrations/autodiff
        run: cargo test --locked --release
      # owalnuts-bridgestan: this matrix checks every Rust host toolchain.
      # The dedicated qualification job below compiles and requires a real
      # BridgeStan model on Linux GNU and Windows MSVC.
      - name: bridgestan — check, clippy
        working-directory: integrations/bridgestan
        run: |
          cargo fmt --all -- --check
          cargo check --locked --all-targets --all-features
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo clippy --locked --all-targets -- -D warnings
      - name: bridgestan — tests (model-dependent tests skip without BridgeStan)
        working-directory: integrations/bridgestan
        run: cargo test --locked --release --all-features
      # owalnuts-python: the PyO3 extension (wheels are built and tested
      # against a fresh interpreter in wheels.yml; this checks the crate).
      - name: python — format, clippy (with and without the `stan` feature)
        working-directory: integrations/python
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo clippy --locked --all-targets --no-default-features -- -D warnings

  bridgestan-real-model:
    name: BridgeStan real model (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GNU 1.88
            os: ubuntu-latest
            toolchain: 1.88.0-x86_64-unknown-linux-gnu
            make: make
          - name: Windows MSVC 1.88 host / MinGW model
            os: windows-latest
            toolchain: 1.88.0-x86_64-pc-windows-msvc
            make: mingw32-make
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      MAKE: ${{ matrix.make }}
      OWALNUTS_BRIDGESTAN_REQUIRE_REAL_MODEL: "1"
      OWALNUTS_BRIDGESTAN_REAL_MODEL: ${{ github.workspace }}/integrations/bridgestan/models/eight_schools_model.so
      OWALNUTS_BRIDGESTAN_REAL_DATA: ${{ github.workspace }}/integrations/bridgestan/models/eight_schools.data.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Install the MinGW model toolchain
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
      - name: Expose the MinGW model toolchain to Python and the Rust test host
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'
      - name: Cache BridgeStan and the Stan Math build
        uses: actions/cache@v6
        with:
          path: ~/.bridgestan
          key: bridgestan-2.9.0-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Install pinned BridgeStan
        run: python -m pip install --disable-pip-version-check "bridgestan==2.9.0"
      - name: Compile Eight Schools
        run: python -c "from pathlib import Path; import bridgestan.compile as c; output = c.compile_model('integrations/bridgestan/models/eight_schools.stan'); print(output); assert Path(output).is_file()"
      - name: Run required real-model BridgeStan tests
        working-directory: integrations/bridgestan
        run: cargo test --locked --release --test load -- --nocapture
